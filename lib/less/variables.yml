PATH_IMAGES: '"../images/"'
PATH_FRONT_IMAGES: '@PATH_IMAGES'
PATH_FONTS:  '"../../fonts/"'

font-family: '"Helvetica Neue", Helvetica, Arial, sans-serif'
scrollbar-width: '17px'
# buttons-style: gradient
buttons-style: flat

# colors
callisto-blue:              '#2A3F54'

## grays
gray-base:                  '#000'
gray-darker:                'lighten(@gray-base, 13.5%)' # #222
gray-dark:                  'lighten(@gray-base, 20%)'   # #333
gray:                       'lighten(@gray-base, 33.5%)' # #555
gray-light:                 'lighten(@gray-base, 46.7%)' # #777
gray-lighter:               'lighten(@gray-base, 93.5%)' # #eee

## states
color-primary:              '#337ab7'
color-success:              '#5cb85c'
color-info:                 '#5bc0de'
color-warning:              '#f0ad4e'
color-danger:               '#d9534f'

state-success-text:         '#3c763d'
state-success-bg:           '#dff0d8'
state-success-border:       'darken(spin(@state-success-bg, -10), 5%)'

state-info-text:            '#31708f'
state-info-bg:              '#d9edf7'
state-info-border:          'darken(spin(@state-info-bg, -10), 7%)'

state-warning-text:         '#8a6d3b'
state-warning-bg:           '#fcf8e3'
state-warning-border:       'darken(spin(@state-warning-bg, -10), 5%)'

state-danger-text:          '#a94442'
state-danger-bg:            '#f2dede'
state-danger-border:        'darken(spin(@state-danger-bg, -10), 5%)'

# breakpoints
sm-max-width: 900px
md-max-width: 1280px
lg-max-width: 1400px

screen-xs-min:              '480px'
screen-sm-min:              '768px'
screen-md-min:              '992px'
screen-lg-min:              '1200px'

screen-xs-max:              '(@screen-sm-min - 1)'
screen-sm-max:              '(@screen-md-min - 1)'
screen-md-max:              '(@screen-lg-min - 1)'

# grid-columns:               '12'
grid-gutter-width:          '30px'
grid-breakpoint:            '@screen-sm-min'
grid-mobile-breakpoint:     '(@grid-breakpoint - 1)'

# grid-float-breakpoint:      '@screen-sm-min'
# grid-float-breakpoint-max:  '(@grid-float-breakpoint - 1)'

# container-sm: '(720px + @grid-gutter-width)'
# container-md: '(940px + @grid-gutter-width)'
# container-lg: '(1140px + @grid-gutter-width)'

### LEGACY ###
# modal-overflowing: 1
collapse-display-type:  block

nav-toggle-bg-color: '@callisto-blue'
nav-toggle-border: '1px solid @callisto-blue'
nav-toggle-bar-bg: '#FFF'
nav-toggle-bar-width: '22px'
nav-toggle-padding: '10px'

nav-line-height: 20px

# texts
text-color: '@gray-darker'
link-color: '@color-primary'
link-hover-color: 'darken(@link-color, 15%)'
